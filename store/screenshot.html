<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: #2c2e31; }
  body { width: 1280px; height: 800px; display: flex; align-items: center; justify-content: center; gap: 56px; font-family: 'Roboto Mono', monospace; }
  .copy { width: 380px; color: #d1d0c5; }
  .copy h1 { color: #e2b714; font-size: 34px; line-height: 1.2; margin: 0 0 18px; }
  .copy h1::before { content: '> '; color: #646669; }
  .copy p { color: #646669; font-size: 16px; line-height: 1.6; margin: 0; }
  .copy p b { color: #ff007a; font-weight: 600; }
  iframe { width: 640px; height: 450px; border: 0; border-radius: 14px; box-shadow: 0 24px 60px rgba(0,0,0,.5); background: #323437; }
  body.tile { width: 440px; height: 280px; background: #323437; flex-direction: column; gap: 14px; }
  body.tile img { width: 120px; height: 120px; }
  body.tile h1 { color: #e2b714; font-size: 26px; margin: 0; }
  body.tile p { color: #646669; font-size: 14px; margin: 0; }
</style></head>
<body>
  <div class="copy">
    <h1>slowed + reverb any tab</h1>
    <p>youtube, soundcloud, anything with audio. drag the rate down, turn the reverb up — <b>the pitch drops like a real record</b>. bass boost and 8d audio too.</p>
  </div>
  <iframe src="../extension/popup.html"></iframe>
  <script>
    if (location.hash === '#tile') {
      document.body.className = 'tile';
      document.body.innerHTML = '<img src="../extension/icons/icon128.png" alt=""><h1>&gt; slowedrvb</h1><p>slowed + reverb any tab</p>';
    }
  </script>
</body></html>
