<!doctype html>
<html lang="en" class="loading no-anim">
<head>
  <meta charset="utf-8">
  <title>slowed + reverb</title>
  <script src="trace.js"></script>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <div class="presets" id="presets">
      <button type="button" data-preset="slowed">slowed + reverb</button>
      <button type="button" data-preset="spedup">sped up</button>
      <button type="button" data-preset="reset">reset</button>
    </div>

    <section class="deck" aria-hidden="true">
      <div class="record" id="record"><div class="label"></div></div>
      <div class="arm" id="arm"><span class="pivot"></span><span class="rod"></span><span class="head"></span></div>
    </section>

    <section class="controls" id="controls">
      <div class="ctl">
        <div class="row">
          <label for="rate">speed</label>
          <output id="rateOut" for="rate">1.00×</output>
        </div>
        <input id="rate" type="range" min="0.5" max="1.5" step="0.01" value="1">
      </div>
      <div class="ctl">
        <div class="row">
          <label for="reverbMix">reverb</label>
          <output id="reverbMixOut" for="reverbMix">0%</output>
        </div>
        <input id="reverbMix" type="range" min="0" max="100" step="1" value="0">
      </div>
      <div class="ctl">
        <div class="row">
          <label for="bass">bass</label>
          <output id="bassOut" for="bass">+0.0 dB</output>
        </div>
        <input id="bass" type="range" min="0" max="15" step="0.5" value="0">
      </div>

      <button type="button" class="more" id="more" aria-expanded="false" aria-controls="extras">more ▾</button>

      <div class="extras" id="extras" hidden>
        <div class="ctl">
          <div class="row">
            <label for="reverbDecay">decay</label>
            <output id="reverbDecayOut" for="reverbDecay">3.0 s</output>
          </div>
          <input id="reverbDecay" type="range" min="0.5" max="8" step="0.1" value="3">
        </div>
        <div class="ctl">
          <div class="row">
            <label for="eightD">8d audio</label>
            <button type="button" class="switch" id="eightD" role="switch" aria-checked="false">off</button>
          </div>
          <div id="orbit" hidden>
            <div class="row">
              <label for="eightDPeriod">orbit</label>
              <output id="eightDPeriodOut" for="eightDPeriod">8.0 s</output>
            </div>
            <input id="eightDPeriod" type="range" min="2" max="20" step="0.5" value="8">
          </div>
        </div>
        <div class="ctl" id="panCtl">
          <div class="row">
            <label for="pan">pan</label>
            <output id="panOut" for="pan">C</output>
          </div>
          <input id="pan" type="range" min="-100" max="100" step="1" value="0">
        </div>
        <div class="ctl">
          <div class="row">
            <label for="volume">volume</label>
            <output id="volumeOut" for="volume">100%</output>
          </div>
          <input id="volume" type="range" min="0" max="100" step="1" value="100">
        </div>
      </div>
    </section>

    <p class="status" id="status" role="status"></p>
  </main>
  <script src="settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
